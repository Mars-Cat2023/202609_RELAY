# @package _global_
defaults:
  - /metrics@reported_metrics.val.infill_prediction.exact_match: exact_match
  - /metrics@reported_metrics.val.infill_prediction.token_accuracy: token_accuracy
  - /metrics@reported_metrics.val.infill_prediction.rollout_steps: rollout_steps
  - /metrics@reported_metrics.test.infill_prediction.exact_match: exact_match
  - /metrics@reported_metrics.test.infill_prediction.token_accuracy: token_accuracy
  - /metrics@reported_metrics.test.infill_prediction.rollout_steps: rollout_steps
  - override /datamodule: gram_n_queens_10x10
  - override /model_type: loopholing_bptt_puma
  - override /model: rotary_transformer_xtiny_loopholing

per_device_batch_size: 512
per_device_val_batch_size: 64
global_batch_size: 512
block_size: 100
monitored_metric: val/lm/accumulated_loss

datamodule:
  print_batch_fn: doublebackprop.datamodule.print_batch
  dataset_managers:
    train:
      lm:
        collator:
          mask_all: true
    val:
      lm:
        collator:
          mask_all: true

global_components:
  tokenizer:
    _target_: xlm.datamodule.SimpleSpaceTokenizer.for_numbers
    vocab_size: 3

loss:
  _target_: doublebackprop.loss.LoopholingBPTTPumaLoss
  use_model_confidence: true
  loss_on_visible_tokens: false
  batch_shape_key: input_ids
  num_steps: 2
  stop_grad_h_s: false
  threshold_sampling_sigma: 0.1
  log_puzzle_diagnostics: true
  log_gradient_norms: false
  log_l1_bptt_via_h_diagnosis: false

predictor:
  _target_: doublebackprop.predictor.ConfidenceBasedPredictor
  max_steps: 100
  top_k: 1
  top_p: null
  confidence: top_prob
  threshold: 0.15
  with_loopholing: true
  log_rollout_diagnostics: true
  log_rollout_diagnostics_max_steps: 12

log_predictions:
  _target_: xlm.log_predictions.LogPredictions
  fields_to_keep_in_output:
    - text
    - truth
    - inference_steps
  inject_target: target_ids
  writers:
    - file
    - logger

trainer:
  max_steps: 80_000
  val_check_interval: 5_000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 1
  limit_val_batches: 100
  gradient_clip_val: 0.5

callbacks:
  val_threshold_sweep:
    _target_: doublebackprop.callbacks.ValidationThresholdSweepCallback
    thresholds:
      - 0.05
      - 0.10
      - 0.15
      - 0.20
      - 0.25
    metric_prefix: val_sweep
    prediction_dataloader_substring: prediction

optimizer:
  lr: 0.0005

lr_scheduler:
  name: "constant_with_warmup"
  num_warmup_steps: 2000
  num_training_steps: ${trainer.max_steps}
  monitor: "train/loss"

reported_metrics:
  val:
    infill_prediction:
      exact_match:
        prefix: val/prediction
        update_fn: doublebackprop.metrics.exact_match_update_fn
      token_accuracy:
        prefix: val/prediction
        update_fn: doublebackprop.metrics.infill_token_accuracy_update_fn
      rollout_steps:
        prefix: val/prediction
        update_fn: doublebackprop.metrics.rollout_steps_update_fn
  test:
    infill_prediction:
      exact_match:
        prefix: test/prediction
        update_fn: doublebackprop.metrics.exact_match_update_fn
      token_accuracy:
        prefix: test/prediction
        update_fn: doublebackprop.metrics.infill_token_accuracy_update_fn
      rollout_steps:
        prefix: test/prediction
        update_fn: doublebackprop.metrics.rollout_steps_update_fn

loggers:
  wandb:
    project: BPTT-puzzles
