# @package _global_
# UniRef50 packed sequences: PUMA + Loopholing + BPTT (T=2). FlexAttention + block_size-token packs.
# 2 nodes × 4 A100-80GB:
#   per_device_batch_size=16, 8 GPUs → global_batch_size=512 (with accumulate_grad_batches=4)
# compile=false for BPTT. Unconditional val uses PAPL-style all-mask batches (lengths 100..800).
defaults:
  - override /datamodule: uniref50_packed_mlm
  - override /noise_schedule: dummy
  - override /model_type: loopholing_bptt_puma
  - override /model: rotary_transformer_loopholing

per_device_batch_size: 64
global_batch_size: 1024
block_size: 1024
num_dataloader_workers: 5
monitored_metric: val/lm/accumulated_loss

datamodule:
  dataset_managers:
    train:
      lm:
        make_infinite: true

loss:
  _target_: doublebackprop.loss.LoopholingBPTTPumaLoss
  use_model_confidence: true
  loss_on_visible_tokens: false
  batch_shape_key: input_ids
  num_steps: 2
  stop_grad_h_s: false
  threshold_sampling_sigma: 0.1

predictor:
  _target_: doublebackprop.predictor.ConfidenceBasedPredictor
  max_steps: 1024
  top_k: null
  top_p: 1
  confidence: top_prob
  threshold: 0.15
  with_loopholing: true
  log_rollout_diagnostics: true
  log_rollout_diagnostics_max_steps: 12

trainer:
  max_steps: 1000_000
  val_check_interval: 50000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 3

optimizer:
  lr: 0.0001

model:
  use_flex_attn: true
  weight_decay_all_params: true

lr_scheduler:
  name: "cosine_with_min_lr"
  num_warmup_steps: 2000
  num_training_steps: ${trainer.max_steps}
  monitor: "train/loss"
  min_lr: 1.0e-6
  num_cycles: 2.0

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 2500
    keep_multiple: 40

loggers:
  wandb:
    project: BPTT
