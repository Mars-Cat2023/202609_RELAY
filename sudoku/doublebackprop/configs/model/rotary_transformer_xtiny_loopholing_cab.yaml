# @package _global_
# Loopholing model with a bottleneck cross-attention carry bridge.
model:
  _target_: doublebackprop.model.RotaryTransformerLoopholingCABModel
  num_embeddings: ${tokenizer:full_vocab_size}
  d_model: 384
  num_layers: 4
  nhead: 6
  padding_idx: ${tokenizer:pad_token_id}
  mask_idx: ${tokenizer:mask_token_id}
  dim_feedforward: ${eval:${.d_model}*4}
  dropout: 0.1
  activation: "relu"
  layer_norm_eps: 1.0e-05
  rotary_emb_dim: 64
  max_length: ${eval:${block_size}+${oc.select:input_block_size,0}+4}
  force_flash_attn: false
  final_layer_without_normalization: false
  cab_bottleneck_dim: 128
  cab_n_heads: 4
  cab_n_kv_heads: 4
  cab_dim_feedforward: 128
  cab_zero_init_output: true

tags:
  model: rotary_transformer_xtiny_loopholing_cab
