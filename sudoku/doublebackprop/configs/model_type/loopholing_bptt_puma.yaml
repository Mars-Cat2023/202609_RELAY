# @package _global_
# Streaming PUMA batch + multi-step Loopholing BPTT (LoopholingBPTTPumaLoss).

defaults:
  - /metrics@reported_metrics.train.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.val.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.test.lm.accumulated_loss: accumulated_loss

lightning_module:
  _target_: xlm.harness.Harness

loss:
  _target_: doublebackprop.loss.LoopholingBPTTPumaLoss
  use_model_confidence: true
  loss_on_visible_tokens: false
  batch_shape_key: input_ids
  num_steps: 2
  with_loopholing: true
  stop_grad_h_s: false
  # [LOSS_DIAGNOSTIC] Optional train metrics — grep doublebackprop/loss.py for LOSS_DIAGNOSTIC
  # to find code to remove; safe to delete these three keys + related helpers together.
  log_puzzle_diagnostics: false
  # Extra autograd.grad passes per step; keep off unless debugging gradient balance.
  log_gradient_norms: false
  # L1 = second-step CE: compare ∇L1 vs replay with detached carry (extra forward + grads).
  # Only runs when stop_grad_h_s is false.
  log_l1_bptt_via_h_diagnosis: false

predictor:
  _target_: doublebackprop.predictor.ConfidenceBasedPredictor
  tokenizer: ${global_components:tokenizer}
  max_steps: ${block_size}
  top_k: 1
  top_p: null
  confidence: top_prob
  threshold: 0.15
  with_loopholing: true

diagnostic_metrics: null
reported_metrics:
  train:
    lm:
      accumulated_loss:
        prefix: train/lm
        update_fn: doublebackprop.metrics.mean_metric_update_fn
  val:
    lm:
      accumulated_loss:
        prefix: val/lm
        update_fn: doublebackprop.metrics.mean_metric_update_fn
  test:
    lm:
      accumulated_loss:
        prefix: test/lm
        update_fn: doublebackprop.metrics.mean_metric_update_fn

tags:
  model_type: loopholing_bptt_puma
